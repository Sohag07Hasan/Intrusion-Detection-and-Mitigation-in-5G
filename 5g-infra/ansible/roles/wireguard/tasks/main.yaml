- name: Install WireGuard
  apt:
    name: wireguard
    state: present
    update_cache: true
  become: true

- name: Enable IP forwarding
  sysctl:
    name: net.ipv4.ip_forward
    value: '1'
    state: present
    reload: yes
  become: true

- name: Ensure WireGuard directory exists
  file:
    path: /etc/wireguard
    state: directory
    owner: root
    group: root
    mode: '0700'
  become: true

# - name: Copy private key to node
