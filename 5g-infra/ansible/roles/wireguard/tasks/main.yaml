#     dest: "/etc/wireguard/privatekey"
#     owner: root
#     group: root
#     mode: '0600'
#   no_log: true
#   become: true

- name: Deploy wg0.conf from template
  template:
    src: wg0.conf.j2
    dest: /etc/wireguard/wg0.conf
    owner: root
    group: root
    mode: '0600'
  become: true

- name: Ensure WireGuard is up
  command: wg-quick up wg0
  register: wg_up_output
  failed_when: wg_up_output.rc != 0 and "already exists" not in wg_up_output.stderr
  ignore_errors: yes
  become: true
